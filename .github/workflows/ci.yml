name: ci
on: [push, pull_request]
jobs:
  test:
    # Pinned to the image CI ran on until 2026-10-19: that morning the ubuntu-latest label moved to ubuntu-26.04, which
    # Playwright 1.56 cannot install Chromium on ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
